<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header */
        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header h1 span {
            color: #3b82f6;
        }

        .header p {
            color: #888;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Input Section */
        .input-section {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.95rem;
            color: #e0e0e0;
            resize: vertical;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        textarea::placeholder { color: #555; }

        .btn-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
        }

        button {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #2563eb; }

        button:disabled {
            background: #333;
            cursor: not-allowed;
            color: #666;
        }

        .status {
            font-size: 0.85rem;
            color: #666;
        }

        .status.loading { color: #3b82f6; }
        .status.error { color: #ef4444; }

        /* Results Grid */
        .results {
            display: none;
            gap: 20px;
        }

        .results.visible { display: grid; grid-template-columns: 1fr 320px; }

        /* Sentiment Card */
        .sentiment-card {
            grid-column: 1 / -1;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .sentiment-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sentiment-badge.positive { background: #065f46; color: #34d399; }
        .sentiment-badge.negative { background: #7f1d1d; color: #fca5a5; }
        .sentiment-badge.neutral  { background: #374151; color: #9ca3af; }

        .sentiment-score {
            color: #888;
            font-size: 0.9rem;
        }

        /* Entity Visualization */
        .entity-panel {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            max-height: 600px;
            overflow-y: auto;
        }

        .entity-panel h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 16px;
        }

        .entity-content { line-height: 2.4; font-size: 0.95rem; }
        .entity-content .entity { color: #1a1a1a; font-weight: 600; }

        /* Legend Panel */
        .legend-panel {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            height: fit-content;
        }

        .legend-panel h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 16px;
        }

        .legend-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }

        .legend-item:last-child { border-bottom: none; }

        .legend-tag {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #1a1a1a;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .legend-desc {
            font-size: 0.85rem;
            color: #999;
            line-height: 1.4;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .results.visible { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Fin<span>Sight</span></h1>
            <p>Paste financial text below to extract entities and analyze sentiment using a custom-trained NLP model.</p>
        </div>

        <div class="input-section">
            <form id="nlp-form">
                <textarea id="text-input" placeholder="Paste a financial article or news snippet here..."></textarea>
                <div class="btn-row">
                    <button type="submit" id="analyze-btn">Analyze</button>
                    <span class="status" id="status"></span>
                </div>
            </form>
        </div>

        <div class="results" id="results">
            <div class="sentiment-card" id="sentiment-card"></div>
            <div class="entity-panel">
                <h3>Entities</h3>
                <div class="entity-content" id="entity-vis"></div>
            </div>
            <div class="legend-panel" id="legend-panel">
                <h3>Legend</h3>
                <div id="legend"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('nlp-form');
        const btn = document.getElementById('analyze-btn');
        const status = document.getElementById('status');
        const results = document.getElementById('results');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('text-input').value.trim();

            if (!text) {
                status.textContent = 'Please enter some text.';
                status.className = 'status error';
                return;
            }

            btn.disabled = true;
            status.textContent = 'Analyzing...';
            status.className = 'status loading';
            results.classList.remove('visible');

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text }),
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Request failed.');
                }

                const data = await response.json();

                // Sentiment
                const card = document.getElementById('sentiment-card');
                const cls = data.sentiment_label.toLowerCase();
                card.innerHTML = `
                    <span class="sentiment-badge ${cls}">${data.sentiment_label}</span>
                    <span class="sentiment-score">Compound score: ${data.sentiment_score.toFixed(3)}</span>
                `;

                // Entity visualization
                document.getElementById('entity-vis').innerHTML = data.html;

                // Legend
                const legendDiv = document.getElementById('legend');
                if (data.legend && Object.keys(data.legend).length > 0) {
                    legendDiv.innerHTML = Object.entries(data.legend).map(([label, info]) => `
                        <div class="legend-item">
                            <span class="legend-tag" style="background:${info.color}">${label}</span>
                            <span class="legend-desc">${info.description}</span>
                        </div>
                    `).join('');
                } else {
                    legendDiv.innerHTML = '<p style="color:#666">No entities detected.</p>';
                }

                results.classList.add('visible');
                status.textContent = '';
                status.className = 'status';
            } catch (err) {
                status.textContent = err.message;
                status.className = 'status error';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
